services:
  - type: worker
    name: dramalaruzbekbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    autoDeploy: true
    disk:
      name: dramalaruzbekbot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_PATH
        value: /data/bot.db
      - key: LOG_PATH
        value: /data/bot.log
      - key: BACKUP_DIR
        value: /data/backups
      - key: AUTO_RESTORE_DB
        value: "1"
      - key: AUTO_RESTORE_ONLY_IF_NEWER
        value: "1"
      - key: WEBAPP_ENABLED
        value: "0"
      - key: SOURCE_CHANNEL_ID
        sync: false
